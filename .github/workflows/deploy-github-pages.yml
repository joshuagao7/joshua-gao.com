# DEPRECATED: the site has moved to Vercel (see DEPLOYMENT.md).
# `output: 'export'` was removed from next.config.js so the Trip Planner /api routes work,
# which means `npm run build` no longer emits an `out/` directory and this Pages build would
# fail. The automatic push trigger is therefore disabled; this workflow is manual-only
# (workflow_dispatch) and will be deleted once joshua-gao.com DNS is repointed to Vercel.

name: Deploy to GitHub Pages (deprecated — moved to Vercel)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
